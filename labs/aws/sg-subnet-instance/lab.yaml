---
id: aws-sg-subnet-instance
title: 'Security group: dedicated rules, for_each and a deterministic subnet'
description: Build a security group whose rules are all dedicated resources, factor the ingress rules with for_each, and place an instance in a subnet designated by its tag.
section: aws
level: l3
difficulty: intermediate
lab_type: lab
estimated_time: 45m
skills:
- terraform
- aws-security-group
- for-each
- data-sources
distros:
- debian13
doc_url: https://blog.stephane-robert.info/docs/infra-as-code/provisionnement/terraform/aws/sg-subnet-instance/
certification_tags:
- tf-associate
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
  - CIBLE.md
  - versions.tf
  - variables.tf
  - reseau.tf
  - main.tf
  - outputs.tf
  services:
  - name: floci
    image: floci/floci:1.6.0
    ports:
    - 14566:4566
    run_args:
    - -u
    - root
    - -v
    - /var/run/docker.sock:/var/run/docker.sock
    ready_tcp: 14566
    ready_exec: curl -f http://localhost:4566/_floci/health
    ready_timeout: 120
    post_start:
    - - bash
      - -c
      - |-
        set -eu
        # Floci vient de demarrer avec un etat neuf : tout conteneur floci-ec2-* encore
        # present est un residu d'une session precedente, et il retient un port SSH que
        # la prochaine instance ne pourra pas obtenir.
        D=http://localhost/v1.44
        S=/var/run/docker.sock
        F=%7B%22name%22%3A%5B%22floci-ec2%22%5D%7D
        ids=$(curl -s --unix-socket $S "$D/containers/json?all=1&filters=$F" | grep -o "\"Id\":\"[^\"]*" | cut -d"\"" -f4 || true)
        for id in $ids; do curl -s -o /dev/null -X DELETE --unix-socket $S "$D/containers/$id?force=1&v=1"; done
        test -n "$ids" && echo "conteneurs EC2 orphelins supprimes" || echo "aucun conteneur EC2 orphelin"
validation:
  functional: true
  security: false
  persistence_after_reboot: false
