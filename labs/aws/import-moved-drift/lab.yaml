---
id: aws-import-moved-drift
title: 'Import, moved and drift: the three traps a tutorial never shows'
description: |
  Bring an EC2 instance created outside Terraform under its control, change its logical address without the real object being recreated, then reconcile a drift by ACCEPTING reality rather than overwriting it.
section: aws
level: l3
difficulty: advanced
lab_type: lab
estimated_time: 30m
skills:
- terraform
- import-moved-drift
distros:
- debian13
doc_url: https://blog.stephane-robert.info/docs/infra-as-code/provisionnement/terraform/aws/import-moved-drift/
certification_tags:
- tf-professional
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
  - providers.tf
  - imports.tf
  services:
  - name: floci
    image: floci/floci:1.6.0
    ports:
    - 14566:4566
    run_args:
    - -u
    - root
    - -v
    - /var/run/docker.sock:/var/run/docker.sock
    ready_tcp: 14566
    ready_exec: curl -f http://localhost:4566/_floci/health
    ready_timeout: 120
    post_start:
    - - bash
      - -c
      - |-
        set -eu
        # Floci vient de demarrer avec un etat neuf : tout conteneur floci-ec2-* encore
        # present est un residu d'une session precedente, et il retient un port SSH que
        # la prochaine instance ne pourra pas obtenir.
        D=http://localhost/v1.44
        S=/var/run/docker.sock
        F=%7B%22name%22%3A%5B%22floci-ec2%22%5D%7D
        ids=$(curl -s --unix-socket $S "$D/containers/json?all=1&filters=$F" | grep -o "\"Id\":\"[^\"]*" | cut -d"\"" -f4 || true)
        for id in $ids; do curl -s -o /dev/null -X DELETE --unix-socket $S "$D/containers/$id?force=1&v=1"; done
        test -n "$ids" && echo "conteneurs EC2 orphelins supprimes" || echo "aucun conteneur EC2 orphelin"
    - - bash
      - -c
      - |-
        set -eu
        API=http://localhost:4566/
        AUTH="Authorization: AWS4-HMAC-SHA256 Credential=test/00000000/eu-west-3/ec2/aws4_request, SignedHeaders=host, Signature=0000"
        CT="Content-Type: application/x-www-form-urlencoded"
        appel() { curl -s -X POST "$API" -H "$CT" -H "$AUTH" -d "$1"; }
        deja=$(appel "Action=DescribeInstances&Version=2016-11-15&Filter.1.Name=tag:Name&Filter.1.Value.1=legacy-billing-api&Filter.2.Name=instance-state-name&Filter.2.Value.1=running&Filter.2.Value.2=pending" | grep -o "<instanceId>[^<]*" | head -1 | cut -d">" -f2)
        if [ -n "$deja" ]; then echo "instance heritee deja presente : $deja"; exit 0; fi
        id=$(appel "Action=RunInstances&Version=2016-11-15&ImageId=ami-0abcdef1234567890&MinCount=1&MaxCount=1&InstanceType=t3.micro" | grep -o "<instanceId>[^<]*" | head -1 | cut -d">" -f2)
        test -n "$id" || { echo "creation impossible" >&2; exit 1; }
        appel "Action=CreateTags&Version=2016-11-15&ResourceId.1=$id&Tag.1.Key=Name&Tag.1.Value=legacy-billing-api&Tag.2.Key=Owner&Tag.2.Value=finops" > /dev/null
        echo "instance heritee creee : $id"
validation:
  functional: true
  security: false
  persistence_after_reboot: false
