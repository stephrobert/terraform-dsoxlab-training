---
id: aws-launch-template-autoscaling
title: "Lire un remplacement dans le plan, avant qu'il n'arrive"
description: |
  Un ASG qui référence `version = "$Latest"` ne déclenche jamais d'instance
  refresh, et un `create_before_destroy` posé sur le launch template ne protège
  rien du tout. Lisez ces deux vérités dans le plan converti en JSON, sans
  jamais appeler AWS.
