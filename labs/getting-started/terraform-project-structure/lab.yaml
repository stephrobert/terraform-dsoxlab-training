---
id: getting-started-terraform-project-structure
title: Split a monolith without moving the plan
description: |
  Terraform evaluates every `.tf` file in a directory as a single document: file
  names and their order have no functional effect. Splitting a monolith must
  therefore produce exactly the same plan, and that is what you prove, not the
  presence of well-named files. Then situate each source of variable values in
  the real precedence order.
