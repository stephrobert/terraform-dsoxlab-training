id: getting-started-terraform-workflow
title: Read a plan before applying it
description: |
  An already applied configuration must change. Before touching anything, say
  which of its resources will be updated in place and which will be destroyed
  then recreated. The human-facing plan announces both in the same block of
  text: the only reliable reading is the actions field of the plan converted to
  JSON. Then apply exactly the plan you read, from a saved plan file.
