---
id: getting-started-terraform-workflow
title: Lire un plan avant de l'appliquer
description: |
  Une configuration déjà appliquée doit évoluer. Avant de toucher quoi que ce
  soit, dites lesquelles de ses ressources seront modifiées en place et
  lesquelles seront détruites puis recréées. La sortie humaine du plan annonce
  les deux cas dans le même bloc de texte : la seule lecture fiable est le champ
  des actions du plan converti en JSON. Appliquez ensuite exactement le plan que
  vous avez relu, depuis un plan enregistré.
