title: Prove Terraform / OpenTofu compatibility, and where it stops
description: |
  "The two tools are compatible" is repeated everywhere and checked by nobody.
  Make a configuration portable by declaring the source and version constraint
  of every provider, then establish by the structured state that both binaries
  read the same state, resolve the same versions on two different registries,
  and that the lock file is exactly where portability stops.
