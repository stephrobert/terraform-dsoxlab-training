id: getting-started-providers-resources-data-sources
title: What Terraform manages, and what it merely reads
description: |
  Until you have seen a `destroy` erase the managed objects without touching
  what the data source was reading, you believe a `data` block is a read-only
  resource. Establish both real consequences: a data source creates nothing, and
  it is re-read on every plan, so it can move a plan although not one line of
  code has changed.
