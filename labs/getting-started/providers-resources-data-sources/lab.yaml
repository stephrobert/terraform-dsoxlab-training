title: "What Terraform manages, and what it merely reads"
description: |
  One word separates the two kinds of block: `resource` creates and manages, `data`
  reads. Prove it in the `mode` field of state, then observe the two consequences: a
  `destroy` does not touch what it did not create, and a data source is re-read on
  every plan.
