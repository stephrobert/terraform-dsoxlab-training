---
id: getting-started-terraform-overview
title: Prove that Terraform has a memory
description: |
  A beginner believes Terraform re-reads the `.tf` files and queries the
  infrastructure on every command, the state being an accessory cache. Take that
  idea apart on a purely local configuration: prove a second apply changes
  nothing, that drift caused outside Terraform is detected without losing the
  identity of the untouched resources, that data merely read is not a managed
  resource, and that an object nobody declared stays invisible.
