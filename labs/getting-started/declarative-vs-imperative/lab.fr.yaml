---
id: getting-started-declarative-vs-imperative
title: Prouver l'idempotence là où le script impératif diverge
description: |
  Un script de provisionnement est fourni, et il diverge dès qu'on le rejoue :
  un identifiant différent à chaque appel, un rapport qui s'empile au lieu
  d'être remplacé. Obtenez le même résultat en Terraform, puis établissez par le
  plan qu'un second passage est un non-événement, et corrigez une dérive externe
  sans toucher à votre code.
