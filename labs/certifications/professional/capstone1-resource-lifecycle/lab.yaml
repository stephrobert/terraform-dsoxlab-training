---
id: certifications-professional-capstone1-resource-lifecycle
title: 'Pro · Objective 1: resource lifecycle, import and drift reconciliation'
description: Import into state an EC2 instance created outside Terraform (aws cli
  on Floci), then detect and reconcile a drift. Exam objective 1.
section: certif-pro
level: l4
difficulty: advanced
lab_type: capstone
estimated_time: 4h
skills:
- terraform
- resource-lifecycle
- import
- drift
- floci
distros:
- debian13
doc_url: https://developer.hashicorp.com/terraform/tutorials/pro-cert/pro-review
certification_tags:
- tf-professional
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
  - providers.tf
  - main.tf
  services:
  - name: floci
    image: floci/floci:1.6.0
    ports:
    - 14566:4566
    run_args:
    - -u
    - root
    - -v
    - /var/run/docker.sock:/var/run/docker.sock
    ready_tcp: 14566
    ready_exec: curl -f http://localhost:4566/_floci/health
    ready_timeout: 120
    post_start:
    - - bash
      - -c
      - 'set -eu

        API=http://localhost:4566/

        EC2AUTH="Authorization: AWS4-HMAC-SHA256 Credential=test/00000000/eu-west-3/ec2/aws4_request, SignedHeaders=host, Signature=0000"

        S3AUTH="Authorization: AWS4-HMAC-SHA256 Credential=test/00000000/eu-west-3/s3/aws4_request, SignedHeaders=host, Signature=0000"

        CT="Content-Type: application/x-www-form-urlencoded"

        ec2() { curl -s -X POST "$API" -H "$CT" -H "$EC2AUTH" -d "$1"; }

        curl -s -o /dev/null -X PUT "http://localhost:4566/capstone-archives-legacy" -H "$S3AUTH"

        deja=$(ec2 "Action=DescribeInstances&Version=2016-11-15&Filter.1.Name=tag:Name&Filter.1.Value.1=capstone-facturation&Filter.2.Name=instance-state-name&Filter.2.Value.1=running&Filter.2.Value.2=pending"
        | grep -o "<instanceId>[^<]*" | head -1 | cut -d">" -f2)

        if [ -n "$deja" ]; then echo "instance heritee deja presente : $deja"; exit 0; fi

        id=$(ec2 "Action=RunInstances&Version=2016-11-15&ImageId=ami-0abcdef1234567890&MinCount=1&MaxCount=1&InstanceType=t3.micro" | grep -o "<instanceId>[^<]*" | head -1 | cut -d">" -f2)

        test -n "$id" || { echo "creation impossible" >&2; exit 1; }

        ec2 "Action=CreateTags&Version=2016-11-15&ResourceId.1=$id&Tag.1.Key=Name&Tag.1.Value=capstone-facturation&Tag.2.Key=Owner&Tag.2.Value=finops&Tag.3.Key=Env&Tag.3.Value=prod" > /dev/null

        echo "instance heritee creee : $id"'
validation:
  functional: true
  security: false
  persistence_after_reboot: false
