---
id: write-code-sensitive-data-write-only-arguments
title: 'Write-only arguments: a secret that never lands in the state'
description: Send a secret to the provider without ever persisting it in the Terraform state, using write-only arguments against a local AWS emulator.
section: write-code
level: l2
difficulty: intermediate
lab_type: lab
estimated_time: 30m
skills:
- terraform
- write-only-arguments
- secrets
distros:
- debian13
doc_url: https://blog.stephane-robert.info/docs/infra-as-code/provisionnement/terraform/ecrire-code/gestion-donnees-sensibles/write-only-arguments/
certification_tags:
- tf-associate
- tf-professional
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
  - versions.tf
  - variables.tf
  - outputs.tf
  - main.tf
  - providers.tf
  - terraform.tfvars
  services:
  - name: floci
    image: floci/floci:1.6.0
    ports:
    - 14566:4566
    run_args:
    - -u
    - root
    - -v
    - /var/run/docker.sock:/var/run/docker.sock
    ready_tcp: 14566
    ready_timeout: 120
    post_start:
    - - bash
      - -c
      - |-
        set -eu
        # Floci vient de demarrer avec un etat neuf : tout conteneur floci-ec2-* encore
        # present est un residu d'une session precedente, et il retient un port SSH que
        # la prochaine instance ne pourra pas obtenir.
        D=http://localhost/v1.44
        S=/var/run/docker.sock
        F=%7B%22name%22%3A%5B%22floci-ec2%22%5D%7D
        ids=$(curl -s --unix-socket $S "$D/containers/json?all=1&filters=$F" | grep -o "\"Id\":\"[^\"]*" | cut -d"\"" -f4 || true)
        for id in $ids; do curl -s -o /dev/null -X DELETE --unix-socket $S "$D/containers/$id?force=1&v=1"; done
        test -n "$ids" && echo "conteneurs EC2 orphelins supprimes" || echo "aucun conteneur EC2 orphelin"
validation:
  functional: true
  security: true
  persistence_after_reboot: false
