---
id: first-infra-ansible
title: "Produire un inventaire Ansible depuis le state"
description: |
  Terraform sait ce qu'il a créé ; Ansible doit le savoir aussi. Construisez le
  pont, et rendez-le FIABLE plutôt que seulement fonctionnel : une variable
  typée, des adresses calculées par une fonction HCL, un fichier sérialisé, et
  un inventaire qui disparaît avec le parc qu'il décrit.
