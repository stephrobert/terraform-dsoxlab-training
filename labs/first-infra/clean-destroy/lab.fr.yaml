id: first-infra-clean-destroy
title: "Détruire proprement, et les quatre choses que cela recouvre"
description: |
  Détruire n'est pas une seule opération. Constatez-en quatre qui ne se
  ressemblent pas : le destroy global qu'un garde-fou peut REFUSER, le destroy
  ciblé, le retrait d'une ressource DU CODE, et le destroy complet qui vide le
  state sans supprimer son fichier.
