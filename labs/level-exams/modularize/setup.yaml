---
# Épreuve C : prépare le terrain sur la machine de l'apprenant (dsoxlab #298).
#
# Joué par `dsoxlab run` sur localhost. Ce playbook :
#   1. tire une variante : préfixe, tailles des machines ;
#   2. fournit l'image de base, téléchargée une fois et vérifiée ;
#   3. crée le dépôt Git nu où l'apprenant publiera son module ;
#   4. écrit les deux copies divergentes de la même configuration de machine :
#      `equipe-web`, appliquée pour de vrai (le projet en service), et
#      `equipe-data`, pas encore déployée ;
#   5. retient pour le harnais ce qu'il doit savoir, UUID compris.
#
# Faits mesurés avant d'écrire ce fichier (cahier des charges, §15) :
#   - `?ref=<SHA-1>&depth=1` et `version` sur une source Git échouent à l'init ;
#   - un tag flottant déplacé n'est pris qu'avec `init -upgrade` ; un
#     consommateur au SHA-1 ne bouge pas ;
#   - un module qui embarque son bloc provider est refusé en `for_each`.

- name: Préparer le terrain de l'épreuve C
  hosts: localhost
  gather_facts: false
  vars:
    cache: /var/tmp/dsoxlab-images
    image_de_base: "{{ cache }}/noble-server-cloudimg-amd64.img"
    image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    image_sums: https://cloud-images.ubuntu.com/noble/current/SHA256SUMS
    depot: "{{ lab_workdir }}/depot-modules.git"
    virsh: virsh -c qemu:///system

  tasks:
    # ── 1. La variante ───────────────────────────────────────────────────
    - name: Tirer la variante
      ansible.builtin.set_fact:
        prefixe: "tfc{{ 89999 | random(start=10000) }}"
        tailles_web: "{{ ['petite', 'moyenne'] | shuffle }}"
        tailles_data: "{{ ['petite', 'moyenne'] | shuffle }}"

    # ── 2. L'image de base ───────────────────────────────────────────────
    - name: Créer le cache d'images
      ansible.builtin.file:
        path: "{{ cache }}"
        state: directory
        mode: "0775"

    - name: Regarder si l'image de base est déjà là
      ansible.builtin.stat:
        path: "{{ image_de_base }}"
      register: image

    - name: Télécharger l'image de base, empreinte vérifiée
      ansible.builtin.get_url:
        url: "{{ image_url }}"
        dest: "{{ image_de_base }}"
        checksum: "sha256:{{ image_sums }}"
        mode: "0644"
      when: not image.stat.exists

    # ── 3. Le dépôt Git du module ────────────────────────────────────────
    - name: Repartir d'un répertoire de travail propre
      ansible.builtin.file:
        path: "{{ lab_workdir }}/{{ item }}"
        state: absent
      loop: [depot-modules.git, equipe-web, equipe-data]

    - name: Créer le dépôt nu, branche main
      ansible.builtin.shell: |
        git init -q --bare {{ depot }}
        git -C {{ depot }} symbolic-ref HEAD refs/heads/main
      args:
        creates: "{{ depot }}/HEAD"

    # ── 4. Les deux copies de la configuration ───────────────────────────
    - name: Créer les dossiers des équipes
      ansible.builtin.file:
        path: "{{ lab_workdir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [equipe-web, equipe-data]

    - name: Écrire les deux copies
      ansible.builtin.template:
        src: "{{ item.modele }}"
        dest: "{{ lab_workdir }}/{{ item.equipe }}/main.tf"
        mode: "0644"
      loop:
        - {equipe: equipe-web, modele: fixtures/equipe-web.tf.j2}
        - {equipe: equipe-data, modele: fixtures/equipe-data.tf.j2}

    - name: Mettre en service le projet de l'équipe web
      ansible.builtin.shell: |
        set -e
        terraform init -input=false -no-color
        terraform apply -input=false -no-color -auto-approve
      args:
        chdir: "{{ lab_workdir }}/equipe-web"
      environment:
        TF_IN_AUTOMATION: "1"
      changed_when: true

    - name: Relever l'identité des machines en service
      ansible.builtin.command: "{{ virsh }} domuuid {{ prefixe }}-web-{{ item }}"
      loop: [a, b]
      register: uuids
      changed_when: false

    # ── 5. La mémoire du harnais ─────────────────────────────────────────
    - name: Retenir la variante pour le harnais
      ansible.builtin.copy:
        dest: "{{ lab_state_dir }}/epreuve.json"
        content: >-
          {{ {'prefixe': prefixe, 'depot': depot, 'image_de_base': image_de_base,
              'tailles_web': {'a': tailles_web[0], 'b': tailles_web[1]},
              'tailles_data': {'a': tailles_data[0], 'b': tailles_data[1]},
              'uuid_web': {'a': uuids.results[0].stdout | trim, 'b': uuids.results[1].stdout | trim}} | to_nice_json }}
        mode: "0600"

    - name: Donner à l'apprenant l'adresse du dépôt et l'image
      ansible.builtin.copy:
        dest: "{{ lab_workdir }}/contexte.txt"
        content: |
          Dépôt Git du module : file://{{ depot }}
          Image de base       : {{ image_de_base }}
          Préfixe             : {{ prefixe }}
        mode: "0644"
